services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_surprise
      POSTGRES_USER: surprise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surprise-local-only}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - surprise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surprise -d project_surprise"]
      interval: 5s
      timeout: 3s
      retries: 10
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  surprise-postgres:
