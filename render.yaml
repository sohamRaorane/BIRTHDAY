services:
  - type: web
    name: littlemoment
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:generate:render && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:deploy:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: littlemoment-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: PRIVATE_MEDIA_DIR
        value: /tmp/private-media
      - key: MAX_BIRTHDAY_VIDEO_BYTES
        value: "524288000"

databases:
  - name: littlemoment-db
    plan: free
